[package]
name = "whoopz"
version = "0.0.0"
edition = "2024"
description = "Always-on undo for the Linux terminal"
license = "MIT"
repository = "https://github.com/suraniharsh/whoopz"
readme = "README.md"
keywords = ["undo", "terminal", "shell", "seccomp", "linux"]
categories = ["command-line-utilities"]

# The project is Whoopz; the command you type is `whoops`.
[[bin]]
name = "whoops"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
libseccomp = "0.4.0"
nix = { version = "0.31.3", features = ["fs", "poll", "process", "signal", "socket", "uio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
libc = "0.2.191"
nix = { version = "0.31.3", features = ["term"] }
tempfile = "3.27.0"
