name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Shells for the interactive tests. Whoopz itself needs nothing installed.
      - name: shells
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish

      # Keep in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: tests
        run: cargo test --locked

  portable:
    name: static binary on other distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
          cache-on-failure: true

      - name: build x86_64 (static)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: run it on Ubuntu 20.04, Debian, Fedora and Alpine
        run: scripts/portable-check.sh target/x86_64-unknown-linux-musl/release/whoops

      # Can't run here (no ARM machine), but it must keep building.
      - name: build aarch64 (static)
        run: cargo build --release --locked --target aarch64-unknown-linux-musl

  shell-lab:
    name: tests in many shells and versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: lab
          cache-on-failure: true

      # bash, zsh, fish, dash, tcsh, nushell, xonsh, elvish: newest (Arch) and LTS (Ubuntu 24.04).
      - name: shell lab
        run: scripts/shell-lab.sh
