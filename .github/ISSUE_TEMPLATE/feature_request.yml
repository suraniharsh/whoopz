name: Feature request
description: Suggest something Whoopz should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please read the [vision](../blob/main/docs/vision.md) first. Ideas outside it may be closed.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What went wrong, or what couldn't you undo?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like to happen
    validations:
      required: true
